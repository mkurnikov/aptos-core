[package]
name = "aptos-vm-profiling"
version = "0.1.0"
authors = ["Aptos Labs <opensource@aptoslabs.com>"]
repository = "https://github.com/aptos-labs/aptos-core"
homepage = "https://aptoslabs.com"
license = "Apache-2.0"
publish = false
edition = { workspace = true }

[dependencies]
anyhow = { workspace = true }
bcs = { workspace = true }
clap = { workspace = true, features = ["derive"] }
glob = { workspace = true }
once_cell = { workspace = true }
smallvec = { workspace = true }

aptos-keygen = { workspace = true }
aptos-block-executor = { workspace = true }
aptos-gas-meter = { workspace = true }
aptos-vm-environment = { workspace = true }
aptos-vm-types = { workspace = true }
aptos-gas-schedule = { workspace = true }
aptos-move-stdlib = { workspace = true }
aptos-native-interface = { workspace = true }
aptos-table-natives = { workspace = true }
aptos-transaction-simulation = { workspace = true }
aptos-types = { workspace = true }
aptos-vm = { workspace = true, features = ["testing"] }
move-core-types = { workspace = true }

move-binary-format = { workspace = true }
move-ir-compiler = { workspace = true }
move-vm-runtime = { workspace = true }
move-vm-test-utils = { workspace = true }
move-vm-types = { workspace = true }
move-compiler-v2 = { workspace = true }
move-command-line-common = { workspace = true }
move-bytecode-utils = { workspace = true }

aptos-cached-packages = { workspace = true }
aptos-vm-genesis = { workspace = true }

move-package = { workspace = true }
move-unit-test = { workspace = true }
move-model = { workspace = true }
legacy-move-compiler = { workspace = true }
aptos-framework = { workspace = true }

[[bin]]
name = "aptos-vm-bench"
path  = "src/bin/vm_bench.rs"

[[bin]]
name = "run-move"
path = "src/bins/run_move.rs"

[[bin]]
name = "run-profiling"
path = "src/bins/run_profiling.rs"

[[bin]]
name = "run-aptos-p2p"
path = "src/bins/run_aptos_p2p.rs"
